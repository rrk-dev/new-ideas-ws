# CI wrapper. All logic lives in tools/ci/*.sh so any runner can reuse it.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FVM_VERSION: "4.3.1"
  JAVA_VERSION: "17"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1.8.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/fvm
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('.fvmrc', 'app/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-
      - run: bash tools/ci/setup.sh
      - run: bash tools/ci/format.sh
      - run: bash tools/ci/analyze.sh
      - run: bash tools/ci/check_codegen.sh
      - run: bash tools/ci/check_egress.sh
      # SEC-02: every runtime package with network/telemetry code is reviewed
      # in tools/ci/package_audit.json (needs the pub get from setup.sh).
      - run: bash tools/ci/check_packages.sh
      # EXP-01/EXP-08: rendered Markdown goldens pass markdownlint
      # (docs/markdownlint.json; markdownlint-cli2 pinned in the script).
      - run: bash tools/ci/markdownlint.sh
      # Recording policy (SEC-09) on source manifests, plists, entitlements and
      # sources; the android job re-runs it on the merged manifest.
      - run: bash tools/ci/run_slot.sh check_recording_policy.sh SEC-09
      # Store privacy (SEC-06): manifests, usage strings, permissions, copy.
      - run: bash tools/ci/check_store_privacy.sh
      - run: python3 .agents/skills/vv-task-workflow/scripts/tasks.py validate

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dart-lang/setup-dart@v1.8.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/fvm
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('.fvmrc', 'app/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-
      - run: bash tools/ci/setup.sh
      - run: bash tools/ci/test.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  task-gate:
    name: task-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -m pip install pytest==9.1.1
      - uses: dart-lang/setup-dart@v1.8.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/fvm
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('.fvmrc', 'app/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-
      - run: bash tools/ci/setup.sh
      # Tests of the CI gates themselves.
      - run: python3 -m pytest tools/ci/tests -q
      # Model catalog CLI (MDL-01); also needed by `verify --run` for its tags.
      - run: python3 -m pip install cryptography==46.0.3
      - run: python3 -m pytest tools/model-catalog/tests -q
      # Blocking: every `done` task keeps its tagged tests, report and PASS rows.
      - run: python3 .agents/skills/vv-task-workflow/scripts/tasks.py verify --all-done --run

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - id: pins
        run: echo "pins=$(git ls-tree HEAD native/whisper.cpp native/llama.cpp | awk '{print $3}' | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: dart-lang/setup-dart@v1.8.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/fvm
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/ccache
          key: android-${{ runner.os }}-${{ steps.pins.outputs.pins }}-${{ hashFiles('.fvmrc', 'app/pubspec.lock', 'app/android/**/*.gradle*', 'packages/vv_native/android/build.gradle', 'native/CMakeLists.txt', 'native/bridge/**') }}
          restore-keys: android-${{ runner.os }}-
      - run: bash tools/ci/setup.sh
      - run: bash tools/ci/build_android.sh
      # SEC-09: recording policy on the merged manifest (covers plugins).
      - run: bash tools/ci/check_recording_policy.sh --require-merged-manifest
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-dev-debug-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  ios:
    name: ios
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - id: pins
        run: echo "pins=$(git ls-tree HEAD native/whisper.cpp native/llama.cpp | awk '{print $3}' | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - run: brew install cmake ccache
      - uses: dart-lang/setup-dart@v1.8.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/fvm
            ~/.pub-cache
            ~/Library/Caches/CocoaPods
            app/ios/Pods
            ~/Library/Caches/ccache
          key: ios-${{ runner.os }}-${{ steps.pins.outputs.pins }}-${{ hashFiles('.fvmrc', 'app/pubspec.lock', 'app/ios/Podfile.lock', 'native/CMakeLists.txt', 'native/bridge/**') }}
          restore-keys: ios-${{ runner.os }}-
      - run: bash tools/ci/setup.sh
      - run: bash tools/ci/build_ios.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-dev-unsigned-app
          path: app/build/ios/Runner-dev.app.zip
          retention-days: 14

  native-host:
    name: native-host
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          # PRF-09 eval change detection diffs against the base branch.
          fetch-depth: 0
      - id: pins
        run: echo "pins=$(git ls-tree HEAD native/whisper.cpp native/llama.cpp | awk '{print $3}' | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-host-${{ runner.os }}-${{ steps.pins.outputs.pins }}-${{ hashFiles('native/CMakeLists.txt', 'native/bridge/**') }}
          restore-keys: ccache-host-${{ runner.os }}-${{ steps.pins.outputs.pins }}-
      - uses: dart-lang/setup-dart@v1.8.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/fvm
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('.fvmrc', 'app/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-
      - run: bash tools/ci/setup.sh
      # native/build.sh host (ctest: smoke + exports) + Dart FFI test on the host library.
      - run: bash tools/ci/native_host.sh
      # REL-03: host native library within budget (tools/ci/size-budget.json).
      - run: bash tools/ci/size_check.sh
      # PRF-09: extraction eval with --gate, only when profiles, the prompt
      # builder, the eval or llama.cpp changed (tools/ci/eval.sh skips otherwise).
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/vaultvoice/test-models
          key: test-models-${{ hashFiles('tools/ci/test-models.lock') }}
      - name: Fetch test models (PRF-09 eval)
        run: bash tools/ci/fetch_test_models.sh | tail -1 >> "$GITHUB_ENV"
      - name: Extraction eval (PRF-09, prompt/profile changes only)
        run: bash tools/ci/eval.sh --base origin/${{ github.base_ref || 'main' }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: extraction-eval
          path: build/eval
          retention-days: 14
          if-no-files-found: ignore
