name: vv_native
description: Dart FFI bindings and build glue for the VaultVoice native bridge (whisper.cpp + llama.cpp).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  ffigen: ^20.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
