name: vaultvoice
description: Local-first AI voice to Markdown app. No user content leaves the device.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cupertino_icons: ^1.0.8
  drift: 2.35.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0
  path: 1.9.1
  path_provider: 2.1.6
  riverpod_annotation: ^4.0.7
  sqlite3: 3.7.0
  vv_native:
    path: ../packages/vv_native

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: 2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
