name: vaultvoice
description: Local-first AI voice to Markdown app. No user content leaves the device.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.1
  characters: ^1.4.1
  crypto: 3.0.7
  cryptography: 2.9.0
  cupertino_icons: ^1.0.8
  drift: 2.35.2
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: 1.0.12
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0
  # Version pinned by flutter_localizations (APP-06).
  intl: 0.20.3
  just_audio: 0.10.6
  mustache_template: 2.0.5
  path: 1.9.1
  path_provider: 2.1.6
  re_editor: 0.10.0
  re_highlight: 0.0.3
  record: 7.1.2
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.1
  sqlite3: 3.7.0
  unorm_dart: 0.3.2
  vv_native:
    path: ../packages/vv_native
  yaml: 3.1.4

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: 2.35.1
  fake_async: ^1.3.3
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^29.0.8
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # ARB → AppLocalizations (l10n.yaml, APP-06).
  generate: true
  assets:
    # Signed fallback model catalog (MDL-01) — never hand-edit, see
    # tools/model-catalog/README.md.
    - assets/catalog/
    # Built-in extraction profiles (PRF-01) — read-only, keyed (id, version).
    - assets/profiles/
    # Built-in Markdown templates (EXP-01) — read-only, never stored as rows.
    - assets/templates/
    # Full pub / native / model licence notices (SEC-05, tools/licenses/).
    - assets/licenses/
    # In-app privacy policy (SEC-06) — shown offline, never fetched.
    - assets/legal/

# SEC-01 (ADR-SEC-01-file-encryption): bundle SQLite3 Multiple Ciphers instead
# of plain SQLite so the drift database is encrypted (`PRAGMA key`). Verified
# against sqlite3 3.7.0 `doc/hook.md`.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
