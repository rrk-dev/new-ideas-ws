# Built-in profile — DRAFT (PRF-01). PRF-04 tunes instructions/examples
# against the eval set (>= 90% field accuracy, serial exact >= 85%).
# Read-only asset loaded every launch, keyed (id, version).
# Spec: docs/profile-spec.md. Bump `version` on any change to schema,
# instructions or examples.
format: 1
id: warranty
version: 2
name: Warranty & Receipt Logger
description: Spoken notes about a purchase - product, serial number, purchase date, warranty and support contacts.
icon: receipt_long
# PRODUCT-DECISION (LIC-01 open question): master plan §7 lists Warranties
# under Pro. `pro` is a placeholder until the user decides Free vs Pro.
tier: pro
stt:
  vocabulary: []
  diarization: false
  num_speakers: 1
classify:
  keywords: [warranty, receipt, serial number, purchased, bought, model number, guarantee]
instructions: |
  - Use only what is stated in the transcript; leave out anything that is not there. Never invent products, numbers or dates.
  - product: what was bought. brand and model as spoken, else null.
  - serial_number: the serial exactly as spelled. Spelling aids ("<letter> as in <word>") mean just that letter.
    Write letters and digits only, no spaces. If no serial is given, null.
  - purchase_date: the date exactly as spoken, else null.
  - retailer: the shop or website, else null. price: the amount with currency as spoken, else null.
  - warranty_period: value and unit (days, weeks, months, years) if stated, else null.
  - support_contacts: phone numbers, emails or websites for support, as spoken.
  - notes: anything else useful in one or two short sentences, else null.
  - Do not compute the warranty expiry; the app does that.
schema:
  type: object
  required: [product, brand, model, serial_number, purchase_date, retailer, price, warranty_period, support_contacts, notes]
  properties:
    product: {type: [string, "null"], maxLength: 80, description: What was bought}
    brand: {type: [string, "null"], maxLength: 60, description: Manufacturer or brand}
    model: {type: [string, "null"], maxLength: 60, description: Model name or number as spoken}
    serial_number: {type: [string, "null"], maxLength: 40, description: "Serial number, letters and digits only"}
    purchase_date: {type: [string, "null"], maxLength: 40, description: Purchase date exactly as spoken}
    retailer: {type: [string, "null"], maxLength: 80, description: Shop or website}
    price: {type: [string, "null"], maxLength: 30, description: Price with currency as spoken}
    warranty_period:
      type: [object, "null"]
      description: Warranty length if stated
      required: [value, unit]
      properties:
        value: {type: integer, description: Number of units}
        unit: {type: string, enum: [days, weeks, months, years]}
    support_contacts:
      type: array
      maxItems: 5
      description: Support phone numbers, emails or websites
      items: {type: string, maxLength: 120}
    notes: {type: [string, "null"], maxLength: 300, description: Other useful details}
reduce:
  notes: llm_summarize
  support_contacts: union_dedupe
post_process: [normalize_serial, resolve_relative_dates, compute_warranty_expiry]
# No few-shot examples: small models copy example content into the output
# (docs/profile-spec.md, "Examples and leakage").
examples: []
template_id: warranty-default
filename_pattern: "{{date:YYYY-MM-DD}}-Warranty-{{slug}}.md"
routing:
  default_target: ask
review_before_export: false
# SEC-07: personal profile, no per-recording confirmation (first-run
# acknowledgement still applies).
consent_confirmation: none
