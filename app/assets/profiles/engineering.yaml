# Built-in profile — DRAFT (PRF-01). PRF-05 tunes instructions/examples
# against the eval set (TODO recall >= 80%, trade-offs paired >= 70%).
# Read-only asset loaded every launch, keyed (id, version).
# Spec: docs/profile-spec.md. Bump `version` on any change to schema,
# instructions or examples.
format: 1
id: engineering
version: 1
name: Engineering / Brainstorming
description: Technical discussions - architecture concepts, API designs, trade-offs, decisions and TODOs.
icon: architecture
# PRODUCT-DECISION (LIC-01 open question): Free vs Pro is undecided.
# `pro` is a placeholder (§7 puts domain profiles such as Sprint Notes in Pro).
tier: pro
stt:
  # PRF-05: users can extend this technical vocabulary.
  vocabulary: [API, REST, gRPC, GraphQL, Kubernetes, latency, schema, endpoint]
  diarization: true
  num_speakers: auto
classify:
  keywords: [architecture, API, design, trade-off, refactor, endpoint, schema, brainstorm, TODO]
instructions: |
  - Extract only what is explicitly said. Never invent components, APIs or owners.
  - title: short topic of the discussion. context: 1-3 sentences on the problem being solved.
  - concepts: architecture ideas or components discussed, one short phrase each.
  - api_designs: proposed APIs. name, a one-sentence description, and the endpoints or
    function signatures exactly as spoken (e.g. "GET /users/{id}").
  - tradeoffs: each option considered with its pros and cons as stated.
  - decisions: things the group agreed on, one short sentence each.
  - todos: concrete next steps. owner = the person responsible if stated, else null.
    t = the [hh:mm:ss] timestamp of the line where it was stated.
  - open_questions: questions raised but not answered.
  - If a field has nothing, return an empty list or null.
schema:
  type: object
  required: [title, context, concepts, api_designs, tradeoffs, decisions, todos, open_questions]
  properties:
    title: {type: string, maxLength: 80, description: Short discussion title}
    context: {type: [string, "null"], maxLength: 400, description: The problem being solved}
    concepts:
      type: array
      maxItems: 20
      items: {type: string, maxLength: 120}
    api_designs:
      type: array
      maxItems: 10
      items:
        type: object
        required: [name, description, endpoints_or_signatures]
        properties:
          name: {type: string, maxLength: 60}
          description: {type: [string, "null"], maxLength: 200}
          endpoints_or_signatures:
            type: array
            maxItems: 10
            items: {type: string, maxLength: 160}
    tradeoffs:
      type: array
      maxItems: 10
      items:
        type: object
        required: [option, pros, cons]
        properties:
          option: {type: string, maxLength: 80}
          pros:
            type: array
            maxItems: 6
            items: {type: string, maxLength: 160}
          cons:
            type: array
            maxItems: 6
            items: {type: string, maxLength: 160}
    decisions:
      type: array
      maxItems: 20
      items: {type: string, maxLength: 200}
    todos:
      type: array
      maxItems: 30
      items:
        type: object
        required: [task, owner, t]
        properties:
          task: {type: string, maxLength: 200}
          owner: {type: [string, "null"], maxLength: 60}
          t: {type: [string, "null"], maxLength: 8, description: "hh:mm:ss timestamp of the source line"}
    open_questions:
      type: array
      maxItems: 20
      items: {type: string, maxLength: 200}
reduce:
  context: llm_summarize
post_process: [map_owner_to_speaker, drop_ungrounded_timestamps, sort_by_timestamp]
examples:
  - transcript: |
      [00:00:04] Lena: For sync we either poll every minute or push over websockets.
      [00:00:10] Omar: Polling is simple but wastes battery. Websockets are instant but need a gateway.
      [00:00:19] Lena: Let's start with polling. Omar, can you sketch GET /changes?since=cursor?
      [00:00:26] Omar: Sure. Open question is how long we keep the change log.
    output:
      title: Sync strategy
      context: Choosing how clients receive changes from the server.
      concepts: [change log, cursor-based sync]
      api_designs:
        - name: Changes feed
          description: Returns changes after a cursor.
          endpoints_or_signatures: ["GET /changes?since=cursor"]
      tradeoffs:
        - {option: Polling, pros: [simple], cons: [wastes battery]}
        - {option: Websockets, pros: [instant], cons: [needs a gateway]}
      decisions: [Start with polling]
      todos:
        - {task: Sketch the GET /changes endpoint, owner: Omar, t: "00:00:19"}
      open_questions: ["How long is the change log kept?"]
template_id: engineering-default
filename_pattern: "{{date:YYYY-MM-DD}}-Engineering-{{slug}}.md"
routing:
  default_target: ask
review_before_export: false
# SEC-07: multi-person profile.
consent_confirmation: required
