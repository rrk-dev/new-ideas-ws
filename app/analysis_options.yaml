include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # No `dynamic` calls: they hide type errors (AGENTS.md / FND-01).
    avoid_dynamic_calls: error
    avoid_print: error

linter:
  rules:
    avoid_dynamic_calls: true
    avoid_print: true
    # Line length stays at the `dart format` default (80).
    public_member_api_docs: false
