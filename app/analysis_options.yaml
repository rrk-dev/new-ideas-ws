include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: 3.1.9

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    # `flutter gen-l10n` output (APP-06).
    - lib/core/l10n/gen/**
    # drift_dev schema snapshots (`drift_dev make-migrations`).
    - test/db/migrations/**/generated/**
    - macos/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # No `dynamic` calls: they hide type errors (AGENTS.md / FND-01).
    avoid_dynamic_calls: error
    avoid_print: error

linter:
  rules:
    avoid_dynamic_calls: true
    avoid_print: true
    # Line length stays at the `dart format` default (80).
    public_member_api_docs: false
    # Dart 3.13 `const new(...)` syntax is not used in this codebase.
    unnecessary_type_name_in_constructor: false
